<!DOCTYPE html>
<!-- ============================================================
     aha 步骤模拟器脚手架 v1
     ============================================================
     用途：真实机制层（第 4 层）里"随时间发生的过程"——一次请求走完
     某条链路、一个算法逐步执行、一次交互分阶段发生。

     契约（SKILL.md）：
     · 你只改 [SIM-DATA] 区（节点 + 步骤数据），不碰 [SIM-ENGINE] 播放器。
     · sim-* 样式已在 design-tokens.css 中，无需写任何模拟器 CSS。
     · 引擎已实现：进视口自动播一次 / 上一步/下一步/重置 / 暂停 /
       prefers-reduced-motion 直出终态 / narration aria-live。
     · 本文件可直接浏览器打开预览示例；复制时只取标记区。
     ============================================================ -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>aha · 步骤模拟器脚手架</title>
<style>
/* ============================================================
   aha-design-tokens v1.3.1 — 唯一合法的颜色/字号/圆角来源
   ============================================================
   规则（SKILL.md 契约）：
   1. 页面必须原样内联本文件的 <style> 块（保留 aha-design-tokens 标记）。
   2. 颜色只能通过 var(--token) 或本文件定义的语义类名使用。
   3. tokens 块之外禁止出现 hex / rgb() / hsl() —— `aha check` 会扫描。
   4. 页面自定义 CSS（布局、SVG 图形）允许，但取色必须 var()。
   双轴换肤(明暗主题 × 预设风格)：
   · data-theme = dark | light(明暗)（明暗对等：每个颜色成对派生）
   · data-preset = warm（默认·暖编辑部）| pop（活泼·糖果）| ink（冷静·专业）
   只翻 <html> 属性换肤，组件代码零改动；预设只覆写颜色，不改字号与间距。
   色距规则（v1.3.1）：cat-b 与 ok/info/accent/cat-c 四邻均须常视力 ΔE>20；
   cat-a 勿与 accent/warn 相邻出现。ΔE>20 指常视力 —— 色觉缺陷下靠文字标签
   冗余承载语义（对比卡标题始终有文字，不是仅靠颜色区分）。
   ============================================================ */

:root, :root[data-theme="dark"] {
  /* 表面 */
  --bg:      #161210;
  --surface: #1f1915;
  --panel:   #27201a;
  --panel-2: #2f2620;
  --line:    #423629;
  --line-2:  #5c4b39;

  /* 文本（4 级） */
  --t-1: #f7f1e7;
  --t-2: #d9cdba;
  --t-3: #a99b82;
  --t-4: #9b8f7c;

  /* 语义色 */
  --accent:      #ffab2e;  /* 金橙 —— 强调 / 当前行 */
  --accent-ink:  #241a09;  /* accent 上的文字 */
  --accent-soft: rgba(255, 171, 46, .14);
  --warn:      #ff8577;    /* 珊瑚 —— 边界 / 警示 */
  --warn-soft: rgba(255, 133, 119, .12);
  --ok:        #6fe3a5;    /* 确认 / 成功路径 */
  --ok-soft: rgba(111, 227, 165, .12);
  --info:      #7fd4ea;    /* 中性信息 */
  --info-soft: rgba(127, 212, 234, .12);

  /* 概念类别色（对比卡 / 结构图分区，最多 3 类 + 中性） */
  --cat-a: #f6a931;  --cat-a-soft: rgba(246, 169, 49,  .15);
  --cat-b: #2897e2;  --cat-b-soft: rgba(40, 151, 226,  .15);
  --cat-c: #c39bef;  --cat-c-soft: rgba(195, 155, 239, .15);
  --cat-n: #b3a48c;  --cat-n-soft: rgba(179, 164, 140, .14); /* 中性 */

  /* 字阶 */
  --fs-display: clamp(2.2rem, 6vw, 3.4rem);
  --fs-h1:      clamp(1.7rem, 4.5vw, 2.3rem);
  --fs-h2:      clamp(1.3rem, 3.5vw, 1.6rem);
  --fs-h3:      1.12rem;
  --fs-body:    1.02rem;
  --fs-small:   .88rem;
  --fs-label:   .75rem;

  /* 空间 / 圆角 / 其他 */
  --sp-1: .35rem;  --sp-2: .7rem;  --sp-3: 1.1rem;
  --sp-4: 1.7rem;  --sp-5: 2.6rem; --sp-6: 4rem;
  --r-s: 8px;  --r-m: 14px;  --r-l: 22px;
  --content-w: 46rem;
  --shadow: 0 10px 34px rgba(0, 0, 0, .34);
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
               "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
  --font-mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas,
               "PingFang SC", monospace;
}

:root[data-theme="light"] {
  --bg:      #fbf6ec;
  --surface: #ffffff;
  --panel:   #f5eddd;
  --panel-2: #ede2cd;
  --line:    #ded1b6;
  --line-2:  #c8b48f;

  --t-1: #271f12;
  --t-2: #5f5540;
  --t-3: #72654b;
  --t-4: #766851;

  --accent:      #8f4e00;
  --accent-ink:  #fffaf0;
  --accent-soft: rgba(143, 78, 0, .11);
  --warn:      #c33423;
  --warn-soft: rgba(195, 52, 35, .09);
  --ok:        #007737;
  --ok-soft: rgba(0, 119, 55, .10);
  --info:      #17708c;
  --info-soft: rgba(23, 112, 140, .09);

  --cat-a: #9a5c00;  --cat-a-soft: rgba(154, 92, 0,  .12);
  --cat-b: #4035c8;  --cat-b-soft: rgba(64, 53, 200, .12);
  --cat-c: #6b3fa3;  --cat-c-soft: rgba(107, 63, 163, .12);
  --cat-n: #71644d;  --cat-n-soft: rgba(113, 100, 77, .11);

  --shadow: 0 8px 26px rgba(96, 74, 40, .13);
}

/* ---- 预设 pop：活泼糖果(v1.2 引入) ---- */
:root[data-preset="pop"] {
  --bg:#191324; --surface:#221b30; --panel:#2b2140; --panel-2:#342850;
  --line:#473868; --line-2:#604b8a;
  --t-1:#f7efff; --t-2:#dccdf2; --t-3:#ab99cd; --t-4:#9586be;
  --accent:#ff5d8f; --accent-ink:#30060f; --accent-soft: rgba(255, 93, 143,.15);
  --warn:#ff8a5c; --warn-soft: rgba(255, 138, 92,.13);
  --ok:#3ee2a2; --ok-soft: rgba(62, 226, 162,.12);
  --info:#4ecbf5; --info-soft: rgba(78, 203, 245,.12);
  --cat-a:#ff9e64; --cat-a-soft: rgba(255, 158, 100,.15);
  --cat-b:#538fe4; --cat-b-soft: rgba(83, 143, 228,.15);
  --cat-c:#cd8ffa; --cat-c-soft: rgba(205, 143, 250,.15);
  --cat-n:#9e93bb; --cat-n-soft: rgba(158, 147, 187,.14);
  --shadow:0 10px 34px rgba(18,6,38,.5);
}
:root[data-preset="pop"][data-theme="light"] {
  --bg:#fdf8ff; --surface:#ffffff; --panel:#f7edfe; --panel-2:#f0e2fb;
  --line:#e5d5f3; --line-2:#cbadf0;
  --t-1:#291838; --t-2:#614b78; --t-3:#76638e; --t-4:#756689;
  --accent:#b81b5e; --accent-ink:#fff5fa; --accent-soft: rgba(184, 27, 94,.10);
  --warn:#bf3606; --warn-soft: rgba(191, 54, 6,.09);
  --ok:#00774b; --ok-soft: rgba(0, 119, 75,.10);
  --info:#0173a2; --info-soft: rgba(1, 115, 162,.09);
  --cat-a:#b04d00; --cat-a-soft: rgba(176, 77, 0,.12);
  --cat-b:#3540b8; --cat-b-soft: rgba(53, 64, 184,.12);
  --cat-c:#8438d6; --cat-c-soft: rgba(132, 56, 214,.12);
  --cat-n:#70638a; --cat-n-soft: rgba(112, 99, 138,.11);
  --shadow:0 8px 26px rgba(96,44,128,.14);
}

/* ---- 预设 ink：冷静专业（light 的 cat-b 不得不高饱和：accent 蓝与 cat-c 紫
   夹逼靛蓝中段，柔靛候选 ΔE76 全部 <20，v1.3.1 取舍记录） ---- */
:root[data-preset="ink"] {
  --bg:#0e131a; --surface:#161c26; --panel:#1c2430; --panel-2:#232c3a;
  --line:#333e4f; --line-2:#4a5768;
  --t-1:#eff3f8; --t-2:#c9d2de; --t-3:#97a3b4; --t-4:#838e9e;
  --accent:#5ea8ff; --accent-ink:#08172b; --accent-soft: rgba(94, 168, 255,.13);
  --warn:#ff7a6e; --warn-soft: rgba(255, 122, 110,.12);
  --ok:#52d9a0; --ok-soft: rgba(82, 217, 160,.12);
  --info:#74c7d6; --info-soft: rgba(116, 199, 214,.12);
  --cat-a:#f0b355; --cat-a-soft: rgba(240, 179, 85,.14);
  --cat-b:#7c93c0; --cat-b-soft: rgba(124, 147, 192,.14);
  --cat-c:#9f8cff; --cat-c-soft: rgba(159, 140, 255,.14);
  --cat-n:#8b98aa; --cat-n-soft: rgba(139, 152, 170,.13);
  --shadow:0 10px 34px rgba(4,10,20,.5);
}
:root[data-preset="ink"][data-theme="light"] {
  --bg:#f6f9fc; --surface:#ffffff; --panel:#ecf1f7; --panel-2:#e0e9f2;
  --line:#d3dde8; --line-2:#b4c3d3;
  --t-1:#17222e; --t-2:#4a5a6b; --t-3:#5c6e82; --t-4:#5d6e7d;
  --accent:#1a5fc0; --accent-ink:#f4f9ff; --accent-soft: rgba(26, 95, 192,.10);
  --warn:#c63526; --warn-soft: rgba(198, 53, 38,.09);
  --ok:#007840; --ok-soft: rgba(0, 120, 64,.10);
  --info:#0c7498; --info-soft: rgba(12, 116, 152,.09);
  --cat-a:#8e5e00; --cat-a-soft: rgba(142, 94, 0,.11);
  --cat-b: #1616df; --cat-b-soft: rgba(22, 22, 223,.11);
  --cat-c:#5b48c2; --cat-c-soft: rgba(91, 72, 194,.11);
  --cat-n:#59697c; --cat-n-soft: rgba(89, 105, 124,.11);
  --shadow:0 8px 26px rgba(30,50,80,.12);
}

/* ============ 基础 ============ */
* { box-sizing: border-box; }
html { scroll-behavior: smooth; color-scheme: dark; }
:root[data-theme="light"] { color-scheme: light; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--t-1);
  font: var(--fs-body)/1.75 var(--font-sans);
  -webkit-font-smoothing: antialiased;
}

/* ============ 布局 ============ */
/* 用逻辑属性让 .container（水平留白）与 .page（垂直节奏）在同一元素上正交组合，
   谁也不会清零谁的 padding（历史坑:简写互相覆盖曾致窄屏贴边) */
.container { max-width: var(--content-w); margin-inline: auto; padding-inline: var(--sp-4); }
.page { padding-block: var(--sp-6) var(--sp-5); }

.section { margin-top: var(--sp-6); }
.grid { display: grid; gap: var(--sp-3); }
.grid-2 { grid-template-columns: repeat(auto-fit, minmax(13rem, 1fr)); }
.grid-3 { grid-template-columns: repeat(auto-fit, minmax(11rem, 1fr)); }

/* ============ 文本 ============ */
.display { font-size: var(--fs-display); font-weight: 800; line-height: 1.18; letter-spacing: -.01em; margin: 0; }
h1 { font-size: var(--fs-h1); font-weight: 750; line-height: 1.25; margin: 0 0 var(--sp-2); }
h2 { font-size: var(--fs-h2); font-weight: 700; line-height: 1.3;  margin: 0 0 var(--sp-2); }
h3 { font-size: var(--fs-h3); font-weight: 650; margin: 0 0 var(--sp-1); }
p  { margin: 0 0 var(--sp-2); }
.t-2, .muted { color: var(--t-2); }
.t-3 { color: var(--t-3); }
.t-4 { color: var(--t-4); }
.lead { font-size: 1.14rem; color: var(--t-2); }

/* 节眉：编号 + 标题（NN · 标题） */
.eyebrow {
  font: 700 var(--fs-label)/1 var(--font-mono);
  letter-spacing: .12em; text-transform: uppercase;
  color: var(--accent);
  margin: 0 0 var(--sp-2);
}
.section > .eyebrow::before { content: attr(data-n) " · "; color: var(--t-4); }

code, .mono { font-family: var(--font-mono); font-size: .92em;
  background: var(--panel-2); padding: .1em .4em; border-radius: 5px; }

/* ============ 表面 ============ */
.card { background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r-m); padding: var(--sp-3) var(--sp-4); }
.panel { background: var(--panel); border: 1px solid var(--line);
  border-radius: var(--r-l); padding: var(--sp-4); }

/* 徽章 / 药丸 */
.badge { display: inline-flex; align-items: center; gap: .4em;
  font: 650 var(--fs-label)/1.2 var(--font-mono); letter-spacing: .08em;
  background: var(--accent-soft); color: var(--accent);
  border: 1px solid var(--line-2); border-radius: 999px; padding: .32em .8em; }
.pill { display: inline-block; font-size: var(--fs-small); color: var(--t-2);
  background: var(--panel); border: 1px solid var(--line);
  border-radius: 999px; padding: .18em .75em; }

/* ============ 语义色（文本用） ============ */
.c-accent { color: var(--accent); } .c-warn { color: var(--warn); }
.c-ok     { color: var(--ok); }     .c-info { color: var(--info); }
.c-cat-a  { color: var(--cat-a); }  .c-cat-b { color: var(--cat-b); }
.c-cat-c  { color: var(--cat-c); }  .c-cat-n { color: var(--cat-n); }

/* ============ 组件：调用框 / 类比框 / 警示条 ============ */
.callout { border-left: 3px solid var(--info); background: var(--info-soft);
  border-radius: 0 var(--r-m) var(--r-m) 0; padding: var(--sp-2) var(--sp-3); margin: var(--sp-3) 0; }
.callout-accent { border-left-color: var(--accent); background: var(--accent-soft); }
.callout-warn   { border-left-color: var(--warn);   background: var(--warn-soft); }
.callout-ok     { border-left-color: var(--ok);     background: var(--ok-soft); }

/* 类比框：直觉层专用。"类比失效点"必须有 */
.analogy { border: 1px dashed var(--line-2); border-radius: var(--r-m);
  padding: var(--sp-3) var(--sp-4); margin: var(--sp-3) 0; }
.analogy-limit { margin-top: var(--sp-2); padding-top: var(--sp-2);
  border-top: 1px dashed var(--line-2); color: var(--t-3); font-size: var(--fs-small); }
.analogy-limit::before { content: "类比到此为止 —— "; color: var(--warn); font-weight: 650; }

/* ============ 组件：对比卡（容易混淆层） ============ */
.compare { display: grid; gap: var(--sp-3);
  grid-template-columns: repeat(auto-fit, minmax(12rem, 1fr)); }
.compare-card { background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r-m); padding: var(--sp-3); }
.compare-card .out { margin-top: var(--sp-2); padding-top: var(--sp-2);
  border-top: 1px solid var(--line); font-size: var(--fs-small); color: var(--t-2); }
.compare-card .out::before { content: "输出："; color: var(--t-4); }
.compare-highlight { border-color: var(--accent);
  box-shadow: 0 0 0 1px var(--accent), var(--shadow); }
.compare-highlight > h3 { color: var(--accent); }

/* ============ 组件：管线（首屏概念链） ============ */
/* 窄屏自动纵排、箭头转向 —— 避免换行后"孤儿箭头"（历史坑） */
.pipe { display: flex; flex-wrap: wrap; gap: var(--sp-2); align-items: stretch; margin: var(--sp-4) 0; }
.pipe .p { flex: 1 1 8rem; background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r-m); padding: var(--sp-2) var(--sp-3); text-align: center; }
.pipe .p b { display: block; font-size: 1.06rem; }
.pipe .p span { font-size: var(--fs-small); color: var(--t-3); }
.pipe .arrow { align-self: center; color: var(--t-4); font-size: 1.4rem; }
@media (max-width: 34rem) {
  .pipe { flex-direction: column; }
  .pipe .arrow { transform: rotate(90deg); }
}

/* ============ 组件：流程图（横向步进） ============ */
.flow { display: flex; flex-wrap: wrap; align-items: stretch; gap: var(--sp-2); }
.flow-step { flex: 1 1 8.5rem; background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r-m); padding: var(--sp-2) var(--sp-3); text-align: center; }
.flow-step .n { font: 700 var(--fs-label)/1 var(--font-mono); color: var(--t-4); }
.flow-arrow { align-self: center; color: var(--t-4); font-size: 1.3rem; }

/* ============ 组件：失败模式（一字标签） ============ */
.fails { display: grid; gap: var(--sp-2); grid-template-columns: repeat(auto-fit, minmax(10rem, 1fr)); }
.fail { background: var(--surface); border: 1px solid var(--line);
  border-left: 3px solid var(--warn); border-radius: var(--r-s);
  padding: var(--sp-2) var(--sp-3); }
.fail .tag { display: inline-block; font-weight: 800; color: var(--warn); margin-right: .4em; }

/* ============ 组件：记（收尾） ============ */
.takeaway { background: var(--panel); border: 1px solid var(--line-2);
  border-radius: var(--r-l); padding: var(--sp-4); margin-top: var(--sp-6);
  font-size: 1.17rem; }
.takeaway::before { content: "记"; display: inline-block; font-weight: 800;
  background: var(--accent); color: var(--accent-ink);
  border-radius: var(--r-s); padding: .05em .55em; margin-right: .6em; }
.takeaway mark { background: var(--accent-soft); color: var(--accent);
  padding: .04em .25em; border-radius: 4px; font-weight: 700; white-space: nowrap; }

/* ============ 组件：步骤模拟器 ============ */
.sim { background: var(--panel); border: 1px solid var(--line-2);
  border-radius: var(--r-l); padding: var(--sp-4); margin: var(--sp-4) 0; }
.sim-stage { display: flex; flex-wrap: wrap; gap: var(--sp-2); align-items: stretch; }
.sim-node { flex: 1 1 9rem; background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r-m); padding: var(--sp-2) var(--sp-3); text-align: center;
  color: var(--t-3); transition: border-color .25s, background .25s, color .25s; }
.sim-node .k { font: 700 var(--fs-label)/1.4 var(--font-mono); letter-spacing: .1em;
  text-transform: uppercase; display: block; }
.sim-node.is-waiting  { border-style: dashed; } /* v1.3：等待态不再整节点半透明（light 下对比度近失明），虚线边框示等待 */
.sim-node.is-active   { border-color: var(--accent); background: var(--accent-soft);
  color: var(--t-1); box-shadow: 0 0 0 1px var(--accent); }
.sim-node.is-done     { border-color: var(--ok); color: var(--t-2); }
.sim-node.is-done .k  { color: var(--ok); }
.sim-narration { min-height: 3.2em; margin: var(--sp-3) 0; padding: var(--sp-2) var(--sp-3);
  background: var(--surface); border-radius: var(--r-m); border: 1px solid var(--line);
  color: var(--t-2); }
.sim-controls { display: flex; gap: var(--sp-2); flex-wrap: wrap; }
.sim-controls button { font: 650 var(--fs-small)/1 var(--font-sans); cursor: pointer;
  background: var(--surface); color: var(--t-1); border: 1px solid var(--line-2);
  border-radius: 999px; padding: .55em 1.2em; transition: border-color .2s; }
.sim-controls button:hover { border-color: var(--accent); }
.sim-controls button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sim-progress { font: 600 var(--fs-label)/1 var(--font-mono); color: var(--t-4);
  margin-left: auto; align-self: center; letter-spacing: .1em; }

/* ============ 组件：工具条（每页标配：主题/风格/分享） ============ */
.toolbar { position: fixed; top: var(--sp-3); right: var(--sp-3);
  display: flex; gap: var(--sp-1); z-index: 20; }
.toolbar button { font: 650 var(--fs-label)/1 var(--font-mono); letter-spacing: .06em;
  color: var(--t-2); background: var(--surface); border: 1px solid var(--line-2);
  border-radius: 999px; padding: .55em 1em; cursor: pointer;
  transition: border-color .2s, color .2s; }
.toolbar button:hover { color: var(--t-1); border-color: var(--accent); }
.toolbar button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.share-pop { position: fixed; top: calc(var(--sp-3) + 2.6rem); right: var(--sp-3); z-index: 20;
  background: var(--panel); border: 1px solid var(--line-2); border-radius: var(--r-m);
  padding: var(--sp-2) var(--sp-3); max-width: min(22rem, calc(100vw - 2rem));
  font-size: var(--fs-small); color: var(--t-2); box-shadow: var(--shadow); }
.share-pop a { color: var(--accent); word-break: break-all; }
.share-pop .hint { color: var(--t-3); }
.share-pop code { word-break: break-all; }

/* 窄屏模拟器两列(v1.3.1:.sim-stage .sim-node 需特异性,不能搭 .pipe 的媒体查询) */
@media (max-width: 34rem) {
  .sim-stage .sim-node { flex: 1 1 calc(50% - var(--sp-2)); }
}

/* ============ 动效（全局降级契约） ============ */
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

</style>
<script>
/* 主题 bootstrap：越早执行越不闪（FOUC 防护） */
(() => { try {
  const r = document.documentElement;
  r.dataset.theme = localStorage.getItem("aha-theme") ||
    (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
  const p = localStorage.getItem("aha-preset"); if (p) r.dataset.preset = p;
} catch (e) {} })();
</script></head>
<body>
<div class="container page">
  <p class="eyebrow">SIMULATOR SCAFFOLD · 预览</p>
  <h1>步骤模拟器脚手架</h1>
  <p class="t-2">这是一个能直接打开运行的示例（通用的三阶段流程）。
    实际生成时：复制 [SIM-MARKUP] + [SIM-DATA] + [SIM-ENGINE] 三段，
    只改 [SIM-DATA]。</p>

  <!-- ==================== [SIM-MARKUP] 复制区（节点名可改） ==================== -->
  <div class="sim" data-sim>
    <div class="sim-stage">
      <!-- 节点：data-node 的值 = SIM_STEPS 里 nodes 的键。k 行是节点标签（跟随页面语言；仅专有技术标识符用原文，如 ClientHello），
           下方文字节点内容会随步骤被 set 覆盖 -->
      <div class="sim-node" data-node="input">
        <span class="k">输入</span>
        <span data-node-text>待命</span>
      </div>
      <div class="sim-node" data-node="process">
        <span class="k">处理</span>
        <span data-node-text>待命</span>
      </div>
      <div class="sim-node" data-node="output">
        <span class="k">输出</span>
        <span data-node-text>待命</span>
      </div>
    </div>

    <p class="sim-narration" data-sim-narration aria-live="polite">
      进入视野后会自动播放一次；也可以用下方按钮逐步查看。
    </p>

    <div class="sim-controls">
      <button type="button" data-sim-reset>重置</button>
      <button type="button" data-sim-prev>上一步</button>
      <button type="button" data-sim-next>下一步</button>
      <button type="button" data-sim-play>播放</button>
      <span class="sim-progress" data-sim-progress>– / –</span>
    </div>
  </div>
  <!-- ==================== /SIM-MARKUP ==================== -->
</div>

<script>
/* ==================== [SIM-DATA] 唯一需要修改的区域 ====================
 * say    : 该步的旁白（一句话，讲"现在发生了什么"）
 * nodes  : 每个节点此刻的状态 —— "waiting" | "active" | "done"
 * set    : 可选。覆盖节点内文字（data-node-text），支持内联 HTML
 * 末步惯例：全部节点 "done"，set 填最终内容 —— reduced-motion 直出这一步
 * ==================================================================== */
const SIM_STEPS = [
  { say: "一切从一次输入开始。",
    nodes: { input: "active", process: "waiting", output: "waiting" },
    set: { input: "输入到达" } },
  { say: "输入被交给处理阶段，处理中。",
    nodes: { input: "done", process: "active", output: "waiting" },
    set: { process: "处理中…" } },
  { say: "处理完成，结果送往下一段。",
    nodes: { input: "done", process: "done", output: "active" },
    set: { process: "完成", output: "接收中" } },
  { say: "输出落地，整条链路走完。",
    nodes: { input: "done", process: "done", output: "done" },
    set: { output: "完成" } },
];
const SIM_MS_PER_STEP = 1600; // 自动播放步进间隔
/* ==================== /SIM-DATA ==================== */


/* ==================== [SIM-ENGINE] 播放器逻辑 —— 禁止修改 ==================== */
(() => {
  for (const root of document.querySelectorAll("[data-sim]")) {
    const steps = SIM_STEPS, last = steps.length - 1;
    const nodes = new Map();
    for (const el of root.querySelectorAll("[data-node]"))
      nodes.set(el.dataset.node, el);
    const narration = root.querySelector("[data-sim-narration]");
    const progress  = root.querySelector("[data-sim-progress]");
    const btnReset  = root.querySelector("[data-sim-reset]");
    const btnPrev   = root.querySelector("[data-sim-prev]");
    const btnNext   = root.querySelector("[data-sim-next]");
    const btnPlay   = root.querySelector("[data-sim-play]");
    let i = -1, timer = null;

    // 回到步骤 0 前的"全待命"状态
    const idleTexts = new Map(
      [...nodes.values()].map(el => [el, el.querySelector("[data-node-text]")?.textContent ?? ""])
    );

    const render = (idx) => {
      if (idx < 0) {
        for (const [id, el] of nodes) {
          el.className = "sim-node is-waiting";
          const t = el.querySelector("[data-node-text]");
          if (t) t.textContent = idleTexts.get(el);
        }
        narration.textContent = "进入视野后会自动播放一次；也可以用下方按钮逐步查看。";
        progress.textContent = "– / " + steps.length;
        return;
      }
      const s = steps[idx];
      for (const [id, el] of nodes) {
        const st = s.nodes[id] ?? "waiting";
        el.className = "sim-node is-" + st;
        if (s.set && s.set[id] !== undefined) {
          const t = el.querySelector("[data-node-text]");
          if (t) t.innerHTML = s.set[id];
        }
      }
      narration.textContent = s.say;
      progress.textContent = (idx + 1) + " / " + steps.length;
    };

    const stop = () => { if (timer) { clearInterval(timer); timer = null; btnPlay.textContent = "播放"; } };
    const go = (idx) => { i = Math.max(-1, Math.min(idx, last)); render(i); };

    btnNext.addEventListener("click", () => { stop(); go(i + 1); });
    btnPrev.addEventListener("click", () => { stop(); go(i - 1); });
    btnReset.addEventListener("click", () => { stop(); go(-1); });
    btnPlay.addEventListener("click", () => {
      if (timer) return stop();
      if (i >= last) go(-1);
      btnPlay.textContent = "暂停";
      timer = setInterval(() => {
        if (i >= last) return stop();
        go(i + 1);
      }, SIM_MS_PER_STEP);
    });

    // reduced-motion：直出终态，不自动播放（按钮仍可用）
    const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
    matchMedia("(prefers-reduced-motion: reduce)").addEventListener("change", (e) => {
      if (e.matches) { stop(); go(last); } // 会话中途开启减少动效：停播并直出终态
    });
    if (reduced) { go(last); }
    else {
      // 进入视口自动播放一次，且仅一次
      let played = false;
      const io = new IntersectionObserver((entries) => {
        if (entries.some(e => e.isIntersecting) && !played) {
          played = true; io.disconnect();
          btnPlay.click();
        }
      }, { threshold: 0.45 });
      io.observe(root);
    }

    render(-1);
  }
})();
/* ==================== /SIM-ENGINE ==================== */
</script>
</body>
</html>
