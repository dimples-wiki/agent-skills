# aha CLI 多平台测试 —— 重点覆盖 Windows 真机路径
# (macOS 本地测不到 win32 分支:盘符探测 / 引导闸门 / 跨盘迁移)
name: aha-cli

on:
  push:
    paths: ["packages/aha-cli/**", ".github/workflows/aha-cli-test.yml"]
  pull_request:
    paths: ["packages/aha-cli/**", ".github/workflows/aha-cli-test.yml"]
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 22]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: packages/aha-cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # 显式列出测试文件:node 22 的 --test 收目录参数会当模块路径解析
      # (MODULE_NOT_FOUND 回归,18/26 正常);glob 在 pwsh 下不展开 —— 列表全版本全 shell 通吃
      # tee 进 step summary:Actions 日志匿名不可读,summary 页面公开,失败细节零认证可查
      # shell: bash —— windows 默认 pwsh,$GITHUB_STEP_SUMMARY 不是 PS 变量(要 $env:)会空串报错
      - run: node --test test/check.test.mjs test/cli.test.mjs test/home.test.mjs test/serve.test.mjs test/share.test.mjs 2>&1 | tee "$GITHUB_STEP_SUMMARY"
        shell: bash

  # Windows 端到端:subst 造一个 D: 盘,跑首次引导 → 迁移 → 留守全链路
  windows-e2e:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: packages/aha-cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: "Map a fake D: drive (subst)"
        shell: pwsh
        run: |
          Write-Host "existing drives: $((Get-PSDrive -PSProvider FileSystem).Name -join ',')"
          New-Item -ItemType Directory -Force C:\fakedrive | Out-Null
          subst D: C:\fakedrive
          if ($LASTEXITCODE -ne 0) { Write-Host "subst exit $LASTEXITCODE, retry via cmd"; cmd /c "subst D: C:\fakedrive" }
          subst
          if (-not (Test-Path D:\)) { Write-Error "subst 未生效"; exit 1 }
      - name: E2E first-run guard / migrate / keep-c
        shell: bash
        env:
          AHA_TEST_HOME: C:\aha-test-home
        run: node test/windows-e2e.mjs 2>&1 | tee "$GITHUB_STEP_SUMMARY"
